services:

  all:
    image: tianon/true:multiarch
    restart: "no"
    depends_on:
      components:
        condition: service_completed_successfully
      deps:
        condition: service_completed_successfully
      tools:
        condition: service_completed_successfully

  components:
    image: tianon/true:multiarch
    restart: "no"
    depends_on:
      component_frontdoor:
        condition: service_healthy
      component_worker:
        condition: service_healthy

  deps:
    image: tianon/true:multiarch
    restart: "no"
    depends_on:
      dep_temporal-db:
        condition: service_started
      dep_temporal-elasticsearch:
        condition: service_started
      dep_temporal-server:
        condition: service_started
      dep_temporal-startupscripts:
        condition: service_completed_successfully

  tools:
    image: tianon/true:multiarch
    restart: "no"
    depends_on:
      tool_temporal-ui:
        condition: service_started

  ### COMPONENTS

  component_frontdoor:
    depends_on:
      dep_temporal-startupscripts:
        condition: service_completed_successfully
    build:
      context: ..
      dockerfile: Containerfile
      args:
        - entrypoint=modules/frontdoor/cmd/frontdoor
    env_file:
      - ./components/frontdoor/.env
    environment:
      - GOCOVERDIR=/app/covdatafiles
    ports:
      - 9090:8080
    healthcheck:
      test: ["CMD", "/bin/grpc-health-probe", "-addr=:8080"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 30s

  component_worker:
    depends_on:
      dep_temporal-startupscripts:
        condition: service_completed_successfully
    build:
      context: ..
      dockerfile: Containerfile
      args:
        - entrypoint=modules/worker/cmd/worker
    env_file:
      - ./components/worker/.env
    environment:
      - GOCOVERDIR=/app/covdatafiles
    ports:
      - 9091:8080
    volumes:
      - ./components/worker/coverage:/app/covdatafiles
    healthcheck:
      test: ["CMD", "/bin/grpc-health-probe", "-addr=:8080"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 30s

  ### DEPENDENCIES

  dep_temporal-db:
    image: postgres:12-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 3s
      timeout: 3s
      retries: 10

  dep_temporal-elasticsearch:
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - ingest.geoip.downloader.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms128m -Xmx128m
      - xpack.security.enabled=false
    image: elasticsearch:8.8.1
    restart: unless-stopped
    ports:
      - 9200:9200
    healthcheck:
      test: curl -s http://dep_temporal-elasticsearch:9200 >/dev/null || exit 1
      interval: 3s
      timeout: 3s
      retries: 10

  dep_temporal-server:
    depends_on:
      dep_temporal-elasticsearch:
        condition: service_healthy
      dep_temporal-db:
        condition: service_healthy
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=dep_temporal-db
      - ENABLE_ES=true
      - ES_SEEDS=dep_temporal-elasticsearch
      - ES_VERSION=v7
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig.yaml
    image: temporalio/auto-setup:1.24.2.1
    restart: unless-stopped
    ports:
      - 7233:7233
    volumes:
      - ./deps/temporal-server/config.yaml:/etc/temporal/config/dynamicconfig.yaml

  dep_temporal-startupscripts:
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.2
    environment:
      - TEMPORAL_CLI_ADDRESS=dep_temporal-server:7233
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    depends_on:
      dep_temporal-elasticsearch:
        condition: service_healthy
      dep_temporal-db:
        condition: service_healthy
    volumes:
      - ./deps/temporal-startupscripts:/etc
    entrypoint: /etc/run.sh

  ### TOOLS

  tool_temporal-ui:
    image: temporalio/ui:2.30.1
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=dep_temporal-server:7233
      - TEMPORAL_UI_PORT=8088
      - HTTPS_PROXY=
      - https_proxy=
    ports:
      - 8088:8088

name: Cache demo

on:
  push:

jobs:
  cache-all:
    name: pull+build cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pull
        uses: pseudo-su/docker-cache@main
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('devstack/compose.yaml', '.github/workflows/demo.yaml') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bake
        uses: docker/bake-action@v5
        with:
          workdir: devstack
          # targets: all
          push: true
          tags: user/app:latest
          load: true
          set: |
            *.cache-to=type=gha,mode=max
            *.cache-from=type=gha

      - name: Pull
        run: |
          make devstack.pull

      - name: Build
        run: |
          make devstack.build

      - name: Start
        run: |
          make devstack.start

      - name: Shutdown
        if: always()
        run: |
          make devstack.stop

      - if: ${{ failure() || cancelled() }}
        name: ⛈️ Print devstack logs (Failure)
        shell: bash
        run: |
          make devstack.logs.export

  cache-pull:
    name: pull cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pull
        uses: pseudo-su/docker-cache@main
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('devstack/compose.yaml', '.github/workflows/demo.yaml') }}

      - name: Pull
        run: |
          make devstack.pull

      - name: Build
        run: |
          make devstack.build

      - name: Start
        run: |
          make devstack.start

      - name: Shutdown
        if: always()
        run: |
          make devstack.stop

      - if: ${{ failure() || cancelled() }}
        name: ⛈️ Print devstack logs (Failure)
        shell: bash
        run: |
          make devstack.logs.export

  cache-build:
    name: build cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bake
        uses: docker/bake-action@v5
        with:
          workdir: devstack
          # targets: all
          push: true
          tags: user/app:latest
          load: true
          set: |
            *.cache-to=type=gha,mode=max
            *.cache-from=type=gha

      - name: Pull
        run: |
          make devstack.pull

      - name: Build
        run: |
          make devstack.build

      - name: Start
        run: |
          make devstack.start

      - name: Shutdown
        if: always()
        run: |
          make devstack.stop

      - if: ${{ failure() || cancelled() }}
        name: ⛈️ Print devstack logs (Failure)
        shell: bash
        run: |
          make devstack.logs.export

  cache-none:
    name: no cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull
        run: |
          make devstack.pull

      - name: Build
        run: |
          make devstack.build

      - name: Start
        run: |
          make devstack.start

      - name: Shutdown
        if: always()
        run: |
          make devstack.stop

      - if: ${{ failure() || cancelled() }}
        name: ⛈️ Print devstack logs (Failure)
        shell: bash
        run: |
          make devstack.logs.export
